<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6B73"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00A878"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E24B4A"/>
    </marker>
  </defs>

  <rect width="1180" height="760" fill="#F4F5F0"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#0D1F2D">Setup Agent chat — derived sidebar override</text>
  <text x="40" y="70" font-size="13" fill="#5B6B73">Solid = built (this cycle) · Dashed = planned (chat behaviour, next cycle) · index.html</text>

  <!-- ============ triggers ============ -->
  <text x="40" y="112" font-size="11" font-weight="700" fill="#5B6B73" letter-spacing="1">FOUR PATHS THAT MUST RELEASE THE OVERRIDE</text>

  <g>
    <rect x="40" y="128" width="228" height="46" rx="8" fill="#FFFFFF" stroke="#E2E6E3"/>
    <text x="56" y="150" font-size="13" font-weight="600" fill="#0D1F2D">closeSetupChat()</text>
    <text x="56" y="166" font-size="11" fill="#5B6B73">chatOpen = false</text>

    <rect x="40" y="186" width="228" height="46" rx="8" fill="#FFFFFF" stroke="#E2E6E3"/>
    <text x="56" y="208" font-size="13" font-weight="600" fill="#0D1F2D">switchModule(mod)</text>
    <text x="56" y="224" font-size="11" fill="#5B6B73">S.module ≠ "setup"</text>

    <rect x="40" y="244" width="228" height="46" rx="8" fill="#FFFFFF" stroke="#E2E6E3"/>
    <text x="56" y="266" font-size="13" font-weight="600" fill="#0D1F2D">loadClient(id)</text>
    <text x="56" y="282" font-size="11" fill="#5B6B73">resetClientState() → freshSetup()</text>

    <rect x="40" y="302" width="228" height="46" rx="8" fill="#FFFFFF" stroke="#E2E6E3"/>
    <text x="56" y="324" font-size="13" font-weight="600" fill="#0D1F2D">no client selected</text>
    <text x="56" y="340" font-size="11" fill="#5B6B73">S.activeClient = null</text>
  </g>

  <!-- arrows into render -->
  <path d="M268 151 L360 220" stroke="#5B6B73" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M268 209 L360 224" stroke="#5B6B73" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M268 267 L360 236" stroke="#5B6B73" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M268 325 L360 248" stroke="#5B6B73" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

  <!-- ============ render() choke point ============ -->
  <rect x="362" y="196" width="330" height="86" rx="10" fill="#0D1F2D"/>
  <text x="382" y="222" font-size="14" font-weight="700" fill="#00D4A0">render()</text>
  <text x="382" y="243" font-size="11" fill="#EDEFF2">the single choke point every path</text>
  <text x="382" y="259" font-size="11" fill="#EDEFF2">already funnels through — first statement,</text>
  <text x="382" y="275" font-size="11" fill="#EDEFF2">above the early return</text>

  <!-- derived predicate -->
  <rect x="362" y="306" width="330" height="92" rx="10" fill="#FFFFFF" stroke="#00A878" stroke-width="2"/>
  <text x="382" y="330" font-size="11" font-weight="700" fill="#00A878" letter-spacing=".5">DERIVED, NOT SET IMPERATIVELY</text>
  <text x="382" y="352" font-size="11.5" font-family="monospace" fill="#0D1F2D">setNavForced(</text>
  <text x="394" y="368" font-size="11.5" font-family="monospace" fill="#E24B4A">!!S.activeClient &amp;&amp;</text>
  <text x="394" y="384" font-size="11.5" font-family="monospace" fill="#0D1F2D">S.module==="setup" &amp;&amp; !!S.setup.chatOpen)</text>

  <path d="M527 282 L527 306" stroke="#00A878" stroke-width="1.6" fill="none" marker-end="url(#av)"/>

  <!-- load-bearing callout -->
  <rect x="362" y="416" width="330" height="66" rx="8" fill="#FDEDED" stroke="#E24B4A"/>
  <text x="378" y="437" font-size="11" font-weight="700" fill="#E24B4A">The activeClient term is load-bearing</text>
  <text x="378" y="454" font-size="10.5" fill="#7a2f2e">Without it: override sticks, #content is replaced by</text>
  <text x="378" y="469" font-size="10.5" fill="#7a2f2e">the empty-client message (chat ✕ gone), ☰ can't recover</text>
  <path d="M527 398 L527 416" stroke="#E24B4A" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- ============ the two independent classes ============ -->
  <text x="770" y="112" font-size="11" font-weight="700" fill="#5B6B73" letter-spacing="1">TWO SOURCES · ONE VISUAL RESULT</text>

  <rect x="770" y="128" width="370" height="104" rx="10" fill="#FFFFFF" stroke="#E2E6E3"/>
  <text x="788" y="152" font-size="13" font-weight="700" fill="#0D1F2D">#app.nav-collapsed</text>
  <text x="788" y="170" font-size="11" fill="#5B6B73">PERSISTED operator preference</text>
  <text x="788" y="187" font-size="11" font-family="monospace" fill="#5B6B73">localStorage bl_nav_collapsed</text>
  <text x="788" y="206" font-size="11" fill="#5B6B73">written by toggleNav() (☰) — the ONLY</text>
  <text x="788" y="222" font-size="11" fill="#5B6B73">localStorage.setItem in the file</text>

  <rect x="770" y="248" width="370" height="104" rx="10" fill="#FFFFFF" stroke="#00D4A0" stroke-width="2"/>
  <text x="788" y="272" font-size="13" font-weight="700" fill="#0D1F2D">#app.nav-forced</text>
  <text x="788" y="290" font-size="11" fill="#5B6B73">TRANSIENT override — never persisted</text>
  <text x="788" y="307" font-size="11" font-family="monospace" fill="#5B6B73">setNavForced(on)</text>
  <text x="788" y="326" font-size="11" fill="#5B6B73">toggles the class and nothing else:</text>
  <text x="788" y="342" font-size="11" fill="#5B6B73">no read, no write of the pref key</text>

  <path d="M692 352 L770 300" stroke="#00A878" stroke-width="1.6" fill="none" marker-end="url(#av)"/>

  <rect x="770" y="368" width="370" height="114" rx="10" fill="#0D1F2D"/>
  <text x="788" y="392" font-size="12" font-weight="700" fill="#00D4A0">Why two classes, not one flag</text>
  <text x="788" y="413" font-size="11" fill="#EDEFF2">Grouped in CSS so they cannot drift:</text>
  <text x="788" y="430" font-size="10.5" font-family="monospace" fill="#9AA3AD">#app.nav-collapsed,#app.nav-forced{...}</text>
  <text x="788" y="452" font-size="11" fill="#EDEFF2">Releasing the override simply reveals the</text>
  <text x="788" y="468" font-size="11" fill="#EDEFF2">preference underneath — it can never overwrite it.</text>

  <!-- ============ layout result ============ -->
  <text x="40" y="536" font-size="11" font-weight="700" fill="#5B6B73" letter-spacing="1">LAYOUT RESULT — SPLIT INSIDE .content (TOPBAR UNAFFECTED, FULL WIDTH)</text>

  <!-- closed -->
  <rect x="40" y="552" width="490" height="168" rx="10" fill="#FFFFFF" stroke="#E2E6E3"/>
  <text x="58" y="574" font-size="12" font-weight="700" fill="#0D1F2D">chatOpen = false — unchanged two-column</text>
  <rect x="58" y="586" width="86" height="112" rx="6" fill="#0D1F2D"/>
  <text x="72" y="646" font-size="10" fill="#00D4A0">sidebar</text>
  <rect x="152" y="586" width="360" height="24" rx="6" fill="#E2E6E3"/>
  <text x="166" y="602" font-size="10" fill="#5B6B73">topbar (full width)</text>
  <rect x="152" y="616" width="360" height="82" rx="6" fill="#F4F5F0" stroke="#E2E6E3"/>
  <text x="166" y="646" font-size="10" fill="#5B6B73">.content → #setup-body</text>
  <text x="166" y="664" font-size="10" fill="#5B6B73">no .setup-split wrapper</text>

  <!-- open -->
  <rect x="550" y="552" width="590" height="168" rx="10" fill="#FFFFFF" stroke="#00D4A0" stroke-width="2"/>
  <text x="568" y="574" font-size="12" font-weight="700" fill="#0D1F2D">chatOpen = true — sidebar hidden, three columns</text>
  <rect x="568" y="586" width="86" height="112" rx="6" fill="#FFFFFF" stroke="#E2E6E3" stroke-dasharray="4 3"/>
  <text x="578" y="640" font-size="9.5" fill="#98A2A8">sidebar</text>
  <text x="578" y="654" font-size="9.5" fill="#98A2A8">hidden</text>
  <rect x="662" y="586" width="460" height="24" rx="6" fill="#E2E6E3"/>
  <text x="676" y="602" font-size="10" fill="#5B6B73">topbar — unchanged, still full width</text>
  <rect x="662" y="616" width="286" height="82" rx="6" fill="#F4F5F0" stroke="#E2E6E3"/>
  <text x="676" y="642" font-size="10" fill="#5B6B73">.setup-col → #setup-body</text>
  <text x="676" y="659" font-size="10" fill="#5B6B73">content UNCHANGED</text>
  <text x="676" y="676" font-size="10" fill="#5B6B73">re-renders independently</text>
  <rect x="956" y="616" width="166" height="82" rx="6" fill="#FFFFFF" stroke="#00D4A0"/>
  <text x="970" y="638" font-size="10" font-weight="600" fill="#0D1F2D">.setup-chat (380px)</text>
  <text x="970" y="654" font-size="9.5" fill="#5B6B73">sticky · 100vh − 48 − 67</text>
  <text x="970" y="672" font-size="9.5" fill="#5B6B73" font-style="italic">shell only — AI next cycle</text>
  <line x1="956" y1="616" x2="956" y2="698" stroke="#00D4A0" stroke-width="1" stroke-dasharray="0"/>

  <text x="568" y="714" font-size="10" fill="#5B6B73">SIBLINGS, never nested: renderSetupBody() rewrites #setup-body alone, so composer text and scroll survive every setup action.</text>
</svg>
