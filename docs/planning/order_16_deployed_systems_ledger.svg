<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6B73"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00A878"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E24B4A"/>
    </marker>
  </defs>

  <rect width="1240" height="900" fill="#F4F5F0"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#0D1F2D">Order 16 — deployed-system ledger (v1)</text>
  <text x="40" y="70" font-size="13" fill="#5B6B73">Solid = exists today · Dashed green = built this cycle · Dotted grey = deliberately out of v1 · index.html + migration 014</text>

  <!-- ============================ COLUMN 1 — the assertion path ============================ -->
  <text x="40" y="106" font-size="11" font-weight="700" fill="#5B6B73" letter-spacing="1">THE ASSERTION PATH</text>

  <rect x="40" y="118" width="280" height="104" rx="8" fill="#FFFFFF" stroke="#E2E6E3"/>
  <text x="56" y="140" font-size="13" font-weight="600" fill="#0D1F2D">build_steps — engine step</text>
  <text x="56" y="160" font-size="11" fill="#5B6B73">agent = automation · workflow[] non-empty</text>
  <text x="56" y="177" font-size="11" fill="#5B6B73">status = done · completed_at stamped</text>
  <text x="56" y="194" font-size="11" fill="#5B6B73">matched_engine · mode retrieve|formulate</text>
  <text x="56" y="212" font-size="11" font-style="italic" fill="#00A878">the as-built spec already lives here</text>

  <rect x="40" y="248" width="280" height="64" rx="8" fill="#FFFFFF" stroke="#E2E6E3"/>
  <text x="56" y="270" font-size="13" font-weight="600" fill="#0D1F2D">Tracker · Done bucket row</text>
  <text x="56" y="290" font-size="11" fill="#5B6B73">isDeployableEngine(s) &amp;&amp; status = done</text>
  <text x="56" y="305" font-size="11" fill="#5B6B73">(no other bucket renders a control)</text>

  <rect x="40" y="338" width="280" height="94" rx="8" fill="#FFFFFF" stroke="#00A878" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="56" y="360" font-size="13" font-weight="600" fill="#0D1F2D">“Mark deployed”</text>
  <text x="56" y="380" font-size="11" fill="#5B6B73">explicit operator assertion — NOT the done click</text>
  <text x="56" y="397" font-size="11" fill="#5B6B73">confirm gate → markDeployed(stepId)</text>
  <text x="56" y="415" font-size="11" font-weight="600" fill="#00A878">INSERT · .select() verified</text>

  <rect x="40" y="460" width="280" height="128" rx="8" fill="#FFFFFF" stroke="#E2E6E3"/>
  <text x="56" y="482" font-size="13" font-weight="600" fill="#0D1F2D">Open-folder delete guard</text>
  <text x="56" y="503" font-size="11" fill="#5B6B73">counts setup_runs</text>
  <text x="232" y="503" font-size="10" fill="#00A878">exists</text>
  <text x="56" y="521" font-size="11" fill="#5B6B73">+ counts deployed_systems</text>
  <text x="232" y="521" font-size="10" font-weight="700" fill="#00A878">new</text>
  <text x="56" y="542" font-size="11" fill="#0D1F2D">≥ 1 of either → BLOCK, archive instead</text>
  <text x="56" y="560" font-size="11" fill="#5B6B73">message names which condition applied,</text>
  <text x="56" y="576" font-size="11" fill="#5B6B73">so “runs” is never blamed for a live engine</text>

  <!-- chain arrows -->
  <path d="M180 222 L180 246" stroke="#5B6B73" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M180 312 L180 336" stroke="#5B6B73" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M320 380 L388 330" stroke="#00A878" stroke-width="1.6" fill="none" marker-end="url(#av)"/>
  <path d="M320 168 L388 210" stroke="#5B6B73" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="332" y="163" font-size="10" fill="#5B6B73">snapshot</text>
  <path d="M320 520 L388 520" stroke="#5B6B73" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="326" y="512" font-size="10" fill="#5B6B73">COUNT(*)</text>

  <!-- ============================ COLUMN 2 — the table ============================ -->
  <text x="390" y="106" font-size="11" font-weight="700" fill="#00A878" letter-spacing="1">THE RECORD</text>

  <rect x="390" y="118" width="350" height="470" rx="8" fill="#FFFFFF" stroke="#00A878" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="408" y="144" font-size="14" font-weight="700" fill="#0D1F2D">deployed_systems</text>
  <text x="408" y="163" font-size="11" fill="#5B6B73">migration 014 · RLS on operator_id · table 11 → 12</text>

  <line x1="408" y1="178" x2="722" y2="178" stroke="#E2E6E3"/>

  <text x="408" y="200" font-size="10" font-weight="700" fill="#5B6B73" letter-spacing="1">SNAPSHOT — survives a plan delete</text>
  <text x="408" y="222" font-size="12" fill="#0D1F2D">title</text>
  <text x="560" y="222" font-size="11" fill="#5B6B73">engine title at deploy time</text>
  <text x="408" y="243" font-size="12" fill="#0D1F2D">engine_key</text>
  <text x="560" y="243" font-size="11" fill="#5B6B73">NULL when formulated</text>
  <text x="408" y="264" font-size="12" fill="#0D1F2D">mode</text>
  <text x="560" y="264" font-size="11" fill="#5B6B73">retrieve | formulate</text>

  <text x="408" y="298" font-size="10" font-weight="700" fill="#5B6B73" letter-spacing="1">POINTERS — ON DELETE SET NULL</text>
  <text x="408" y="320" font-size="12" fill="#0D1F2D">build_step_id</text>
  <text x="560" y="320" font-size="11" fill="#5B6B73">→ build_steps</text>
  <text x="408" y="341" font-size="12" fill="#0D1F2D">build_plan_id</text>
  <text x="560" y="341" font-size="11" fill="#5B6B73">→ build_plans</text>
  <text x="408" y="360" font-size="10" font-style="italic" fill="#5B6B73">plan delete cascades the step away;</text>
  <text x="408" y="375" font-size="10" font-style="italic" fill="#5B6B73">the snapshot above is what remains</text>

  <text x="408" y="409" font-size="10" font-weight="700" fill="#5B6B73" letter-spacing="1">OWNERSHIP</text>
  <text x="408" y="431" font-size="12" fill="#0D1F2D">client_id</text>
  <text x="560" y="431" font-size="11" fill="#5B6B73">→ clients · CASCADE</text>
  <text x="408" y="452" font-size="12" fill="#0D1F2D">operator_id</text>
  <text x="560" y="452" font-size="11" fill="#5B6B73">stamped on INSERT (RLS)</text>

  <text x="408" y="486" font-size="10" font-weight="700" fill="#5B6B73" letter-spacing="1">WHEN</text>
  <text x="408" y="508" font-size="12" fill="#0D1F2D">deployed_at · notes</text>

  <rect x="408" y="526" width="314" height="46" rx="6" fill="#F4F5F0" stroke="#E2E6E3"/>
  <text x="422" y="546" font-size="11" font-weight="600" fill="#0D1F2D">UNIQUE (build_step_id) WHERE NOT NULL</text>
  <text x="422" y="562" font-size="10.5" fill="#5B6B73">one step can never be marked deployed twice</text>

  <!-- engine catalog -->
  <path d="M565 588 L565 618" stroke="#00A878" stroke-width="1.6" fill="none" marker-end="url(#av)"/>

  <rect x="390" y="620" width="350" height="128" rx="8" fill="#FFFFFF" stroke="#E2E6E3"/>
  <text x="408" y="644" font-size="13" font-weight="600" fill="#0D1F2D">engine_catalog — the graduation ladder</text>
  <text x="408" y="665" font-size="11" fill="#5B6B73">status CHECK: formulated → documented → proven</text>
  <text x="408" y="683" font-size="11" fill="#5B6B73">live today: 3 proven · 6 documented · 0 formulated</text>
  <rect x="408" y="695" width="314" height="38" rx="6" fill="#FDF2F2" stroke="#E24B4A" stroke-dasharray="4 3"/>
  <text x="422" y="711" font-size="11" font-weight="700" fill="#E24B4A">v1 NEVER writes this table</text>
  <text x="422" y="726" font-size="10.5" fill="#5B6B73">the ledger is evidence; the operator still decides</text>

  <!-- ============================ COLUMN 3 — readers ============================ -->
  <text x="800" y="106" font-size="11" font-weight="700" fill="#5B6B73" letter-spacing="1">WHAT READS IT (v1)</text>

  <rect x="800" y="118" width="400" height="124" rx="8" fill="#FFFFFF" stroke="#00A878" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="818" y="141" font-size="13" font-weight="600" fill="#0D1F2D">Tracker · “Deployed” card</text>
  <text x="818" y="162" font-size="11" fill="#5B6B73">one line per entry — title · deployed_at · mode</text>
  <text x="818" y="181" font-size="11" fill="#5B6B73">mode = formulate → “graduation-eligible” label</text>
  <text x="818" y="200" font-size="11" fill="#5B6B73">empty state: “Nothing deployed yet.”</text>
  <text x="818" y="224" font-size="11" font-weight="600" fill="#00A878">the four buckets and the header total are untouched</text>

  <rect x="800" y="262" width="400" height="92" rx="8" fill="#FFFFFF" stroke="#00A878" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="818" y="285" font-size="13" font-weight="600" fill="#0D1F2D">Done-bucket row control</text>
  <text x="818" y="306" font-size="11" fill="#5B6B73">not ledgered → [ Mark deployed ]</text>
  <text x="818" y="325" font-size="11" fill="#5B6B73">ledgered → “Deployed · &lt;date&gt;” pill</text>
  <text x="818" y="344" font-size="11" fill="#5B6B73">removeDeployedSystem() = the one mutation</text>

  <path d="M740 190 L798 175" stroke="#00A878" stroke-width="1.5" fill="none" marker-end="url(#av)"/>
  <path d="M740 320 L798 305" stroke="#00A878" stroke-width="1.5" fill="none" marker-end="url(#av)"/>

  <!-- out of scope -->
  <text x="800" y="398" font-size="11" font-weight="700" fill="#9AA3A0" letter-spacing="1">DELIBERATELY OUT OF v1</text>
  <rect x="800" y="410" width="400" height="170" rx="8" fill="none" stroke="#C9CFCB" stroke-dasharray="3 3"/>
  <text x="818" y="436" font-size="12" fill="#9AA3A0">3-audience SOP generation</text>
  <text x="838" y="453" font-size="10.5" fill="#9AA3A0">no substrate; the three audiences are undefined anywhere</text>
  <text x="818" y="478" font-size="12" fill="#9AA3A0">client-level cross-plan “what’s live” map</text>
  <text x="838" y="495" font-size="10.5" fill="#9AA3A0">the surface anticipated at index.html:4122 — its own increment</text>
  <text x="818" y="520" font-size="12" fill="#9AA3A0">automatic catalog graduation</text>
  <text x="838" y="537" font-size="10.5" fill="#9AA3A0">would break “never auto-write — the catalog is also the price sheet”</text>
  <text x="818" y="562" font-size="12" fill="#9AA3A0">supersession / re-deploy semantics · setStepStatus() changes</text>

  <!-- ============================ bottom band ============================ -->
  <rect x="40" y="772" width="1160" height="106" rx="8" fill="#0D1F2D"/>
  <text x="62" y="800" font-size="12" font-weight="700" fill="#00D4A0" letter-spacing="1">WHY THIS IS AN ASSERTION, NOT A DERIVATION</text>
  <text x="62" y="824" font-size="11.5" fill="#F4F5F0">The Setup Agent can mechanically create exactly five kinds — tags, fields, custom values, calendars, pipelines. Workflows are NOT among them:</text>
  <text x="62" y="844" font-size="11.5" fill="#F4F5F0">the engines are hand-built in GHL. clients.ghl_map proves an asset exists but is flat and cannot attribute it to an engine; setup_runs proves a</text>
  <text x="62" y="864" font-size="11.5" fill="#F4F5F0">provisioning run happened but covers only those five kinds. So “engine X is live for client Y” has no derivable source — a human states it.</text>
</svg>
